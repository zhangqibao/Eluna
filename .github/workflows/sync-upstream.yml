name: Sync upstream → master
# Sync ElunaLuaEngine/Eluna@master into zhangqibao/Eluna@master
# (similar to vmangos_last's sync-upstream.yml)
on:
  schedule:
    - cron: '0 0 * * *'   # daily at 00:00 UTC
  workflow_dispatch:       # also allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed to push to master
    steps:
      - name: Checkout fork's master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync upstream → master
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/ElunaLuaEngine/Eluna.git
          git fetch upstream master

          UPSTREAM_HASH=$(git rev-parse upstream/master)
          LOCAL_HASH=$(git rev-parse HEAD)
          MERGE_BASE=$(git merge-base HEAD upstream/master)

          if [ "$UPSTREAM_HASH" = "$LOCAL_HASH" ]; then
            echo "✅ Already up to date with upstream"
            exit 0
          fi

          if [ "$UPSTREAM_HASH" = "$MERGE_BASE" ]; then
            echo "✅ No new upstream commits (upstream is ancestor of master)"
            exit 0
          fi

          # Try merge; abort cleanly on conflict
          if git merge upstream/master --no-edit --no-ff; then
            git push origin master
            echo "✅ Synced upstream → master"
          else
            echo "❌ Merge conflict. Aborting."
            git merge --abort
            exit 1
          fi
