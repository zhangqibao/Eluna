name: Sync master → vmangos-1.12
# Sync zhangqibao/Eluna@master into zhangqibao/Eluna@vmangos-1.12
# (similar to vmangos_last's sync-development-to-master.yml)
on:
  schedule:
    - cron: '0 1 * * *'   # daily at 01:00 UTC (1 hour after sync-upstream)
  workflow_dispatch:       # also allow manual trigger
  workflow_run:
    workflows: ["Sync upstream → master"]
    types: [completed]     # trigger right after sync-upstream finishes

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout fork's vmangos-1.12
        uses: actions/checkout@v4
        with:
          ref: vmangos-1.12
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync master → vmangos-1.12
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin master

          UPSTREAM_HASH=$(git rev-parse origin/master)
          LOCAL_HASH=$(git rev-parse HEAD)
          MERGE_BASE=$(git merge-base HEAD origin/master)

          if [ "$UPSTREAM_HASH" = "$LOCAL_HASH" ]; then
            echo "✅ Already up to date with master"
            exit 0
          fi

          if [ "$UPSTREAM_HASH" = "$MERGE_BASE" ]; then
            echo "✅ No new master commits (master is ancestor of vmangos-1.12)"
            exit 0
          fi

          if git merge origin/master --no-edit --no-ff; then
            git push origin vmangos-1.12
            echo "✅ Synced master → vmangos-1.12"
          else
            echo "❌ Merge conflict. Aborting."
            git merge --abort
            exit 1
          fi
